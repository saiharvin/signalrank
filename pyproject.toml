[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalrank"
version = "0.1.0"
description = "Evidence-grounded behavioral recommendation system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.5",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "uvicorn>=0.27",
]

[project.scripts]
signalrank = "signalrank.cli:main"

[tool.setuptools.packages.find]
include = ["signalrank*"]

